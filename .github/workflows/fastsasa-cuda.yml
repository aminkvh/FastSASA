name: FastSASA CUDA release checks

on:
  push:
    branches:
      - main
    tags:
      - "v*"
  pull_request:
    branches:
      - main
  workflow_dispatch:

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: "true"

jobs:
  cuda-container-build:
    name: CUDA container build (${{ matrix.image }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - image: nvidia/cuda:12.0.1-devel-ubuntu22.04
            host: clang++-14
            packages: clang-14 cmake ninja-build g++ python3 python3-numpy git
          - image: nvidia/cuda:12.2.2-devel-ubuntu22.04
            host: g++-11
            packages: g++-11 cmake ninja-build python3 python3-numpy git
          - image: nvidia/cuda:12.4.1-devel-ubuntu22.04
            host: g++-12
            packages: g++-12 cmake ninja-build python3 python3-numpy git
    runs-on: ubuntu-latest
    container:
      image: ${{ matrix.image }}
    steps:
      - uses: actions/checkout@v4
      - name: Install build tools
        run: |
          apt-get update
          DEBIAN_FRONTEND=noninteractive apt-get install -y --no-install-recommends ${{ matrix.packages }}
      - name: Check CUDA host compiler compatibility
        run: |
          chmod +x tools/check_cuda_toolchain.sh
          CUDAHOSTCXX=${{ matrix.host }} CXX=${{ matrix.host }} tools/check_cuda_toolchain.sh
      - name: Configure FastSASA
        run: |
          cmake -S . -B build-ci -G Ninja \
            -DCMAKE_CUDA_HOST_COMPILER=${{ matrix.host }} \
            -DFASTSASA_BUILD_NATIVE_TESTS=ON
      - name: Build FastSASA
        run: cmake --build build-ci
      - name: Run CPU-safe validation in the CUDA build
        run: ctest --test-dir build-ci --output-on-failure -L cpu
      # Distributable Linux build (newest toolkit only) with every backend
      # compiled in, so the runtime fallback (Vulkan, then CUDA, then CPU)
      # can pick whatever the user's machine has. CUDA SASS is built for
      # every supported major architecture plus PTX (Volta through Hopper).
      - name: Install Vulkan headers and glslc for the distributable build
        if: matrix.image == 'nvidia/cuda:12.4.1-devel-ubuntu22.04'
        # Ubuntu 22.04 has no glslc package; LunarG's jammy repository ships
        # it in `shaderc`.
        run: |
          DEBIAN_FRONTEND=noninteractive apt-get install -y --no-install-recommends wget ca-certificates gnupg
          wget -qO- https://packages.lunarg.com/lunarg-signing-key-pub.asc | gpg --dearmor > /etc/apt/trusted.gpg.d/lunarg.gpg
          wget -qO /etc/apt/sources.list.d/lunarg-vulkan-jammy.list https://packages.lunarg.com/vulkan/lunarg-vulkan-jammy.list
          apt-get update
          # LunarG splits the headers out of libvulkan-dev (Ubuntu's own
          # package bundles them), and CMake's FindVulkan needs both.
          DEBIAN_FRONTEND=noninteractive apt-get install -y --no-install-recommends vulkan-headers libvulkan-dev shaderc
          glslc --version
          test -f /usr/include/vulkan/vulkan.h
      - name: Build the distributable binary (CUDA + Vulkan + CPU)
        if: matrix.image == 'nvidia/cuda:12.4.1-devel-ubuntu22.04'
        run: |
          cmake -S . -B build-dist -G Ninja \
            -DCMAKE_BUILD_TYPE=Release \
            -DCMAKE_CUDA_HOST_COMPILER=${{ matrix.host }} \
            -DCMAKE_CUDA_ARCHITECTURES="70;75;80;86;89;90" \
            -DFASTSASA_ENABLE_CUDA=ON \
            -DFASTSASA_ENABLE_VULKAN=ON \
            -DFASTSASA_BUILD_NATIVE_TESTS=OFF
          cmake --build build-dist
          build-dist/fastsasa --version
      - name: Confirm both GPU backends are compiled in
        if: matrix.image == 'nvidia/cuda:12.4.1-devel-ubuntu22.04'
        run: |
          # No GPU or ICD in the container: each request must fall back to
          # the CPU because the device is missing, never because the backend
          # was left out of the build.
          for backend in vulkan cuda; do
            build-dist/fastsasa --backend $backend tests/data/1ubq.pdb 2> stderr.txt > /dev/null
            cat stderr.txt
            if grep -q "built without" stderr.txt; then
              echo "::error::distributable build lacks the $backend backend"
              exit 1
            fi
          done
      - name: Package the build
        if: matrix.image == 'nvidia/cuda:12.4.1-devel-ubuntu22.04'
        run: |
          mkdir -p dist-linux
          cp build-dist/fastsasa build-dist/libfastsasa_native.* dist-linux/
          cp -r share integration python LICENSE NOTICE dist-linux/
      - uses: actions/upload-artifact@v4
        if: matrix.image == 'nvidia/cuda:12.4.1-devel-ubuntu22.04'
        with:
          name: fastsasa-linux-x64
          path: dist-linux

  cuda-gpu-validation:
    name: CUDA GPU validation
    if: github.event_name != 'pull_request'
    runs-on: [self-hosted, Linux, X64]
    env:
      CUDAHOSTCXX: clang++-14
      CXX: clang++-14
      FASTSASA_CUDA_HOST_COMPILER: clang-14
    steps:
      - uses: actions/checkout@v4
      - name: Show GPU and CUDA toolchain
        run: |
          nvidia-smi
          nvcc --version
      - name: Check CUDA host compiler compatibility
        run: |
          chmod +x tools/check_cuda_toolchain.sh
          tools/check_cuda_toolchain.sh
      - name: Configure FastSASA
        run: |
          cmake -S . -B build-gpu \
            -DCMAKE_CUDA_HOST_COMPILER=${FASTSASA_CUDA_HOST_COMPILER} \
            -DCMAKE_CUDA_ARCHITECTURES=native \
            -DFASTSASA_BUILD_NATIVE_TESTS=ON
      - name: Build FastSASA
        run: cmake --build build-gpu -j4
      - name: Run GPU smoke tests
        env:
          FASTSASA_REQUIRE_GPU_TESTS: "1"
        run: ctest --test-dir build-gpu --output-on-failure -L release
