name: Bug report
description: Report incorrect behavior, crashes, build failures, or validation failures.
title: "[Bug]: "
labels: ["bug"]
body:
  - type: textarea
    id: summary
    attributes:
      label: Summary
      description: What went wrong?
    validations:
      required: true
  - type: textarea
    id: reproduce
    attributes:
      label: Reproduction steps
      description: Include commands, input type, and a minimal example when possible.
      placeholder: |
        cmake -S . -B build -DFASTSASA_BUILD_NATIVE_TESTS=ON
        cmake --build build -j4
        ./build/fastsasa --shrake-rupley --format log tests/data/1ubq.pdb
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected behavior
    validations:
      required: true
  - type: textarea
    id: actual
    attributes:
      label: Actual behavior
      description: Include stderr/stdout snippets where useful.
    validations:
      required: true
  - type: input
    id: fastsasa-version
    attributes:
      label: FastSASA version or commit
      placeholder: Output of fastsasa --version, or a git commit hash
  - type: textarea
    id: environment
    attributes:
      label: Environment
      description: OS, GPU, driver, CUDA toolkit, compiler, Python version.
      placeholder: |
        OS:
        GPU:
        NVIDIA driver:
        CUDA toolkit:
        Compiler:
        Python:
  - type: checkboxes
    id: checks
    attributes:
      label: Checks
      options:
        - label: I did not include private trajectory data or credentials.
          required: true
        - label: I can share a minimal public input or command if needed.
          required: false
