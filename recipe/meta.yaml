{% set name = "fastsasa" %}
{% set version = "0.1.0rc19" %}

package:
  name: {{ name|lower }}
  version: {{ version }}

source:
  # Local scaffold build: points at the repository checkout so the recipe
  # can be validated with `conda-build recipe/` before any release exists.
  # A real submission replaces this with:
  #   url: https://github.com/aminkvh/fastsasa/archive/refs/tags/v{{ version }}.tar.gz
  #   sha256: <computed from the release tarball>
  path: ..

build:
  number: 0
  script:
    - export FASTSASA_ENABLE_CUDA=OFF  # [not win]
    - set "FASTSASA_ENABLE_CUDA=OFF"  # [win]
    - {{ PYTHON }} -m pip install . --no-deps --no-build-isolation -vv
  # setup.py auto-enables CUDA if `nvcc` is merely found on PATH (see
  # setup.py's BuildPyWithNativeLibrary), which is not a safe thing to leave
  # to chance on an arbitrary build machine - forced OFF above. This scaffold
  # targets the CPU + Vulkan build; a CUDA variant would need conda-forge's
  # cuda-toolkit compiler machinery and is out of scope here. Locally
  # validated end to end with `conda-build recipe/ -c conda-forge`: the
  # package builds, installs, and both test commands below pass.
  skip: true  # [win]  # native library name/config differ on Windows; validate separately before enabling

requirements:
  build:
    - {{ compiler('c') }}
    - {{ compiler('cxx') }}
    - cmake >=3.18
    - ninja
    - pkg-config  # [not win]
  host:
    - python
    - pip
    - setuptools >=77
    - wheel
    - vulkan-headers
    - vulkan-loader
    - shaderc  # provides glslc
  run:
    - python
    - numpy
    - vulkan-loader

test:
  imports:
    - fastsasa
  commands:
    - python -c "import fastsasa; print(fastsasa.__version__)"
    - python -c "from fastsasa import sasa; import numpy as np; print(sasa(np.zeros((1,3)), np.array([1.7])))"

about:
  home: https://github.com/aminkvh/fastsasa
  summary: GPU-accelerated Shrake-Rupley and Lee-Richards SASA calculations (Vulkan, CUDA, CPU)
  license: MIT AND MPL-2.0
  license_file:
    - LICENSE
    - NOTICE
    - licenses/FreeSASA-radii-table-MIT.txt
    - licenses/Gemmi-MPL-2.0.txt
    - licenses/Gemmi-third-party-notices.txt
    - licenses/TAO-PEGTL-MIT.txt
    - licenses/volk-MIT.md
  doc_url: https://github.com/aminkvh/fastsasa/tree/main/docs

extra:
  recipe-maintainers:
    - aminkvh
